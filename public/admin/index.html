<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Rise With Pledge Foundation</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/icon-16.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0042ab">
</head>
<body>

  <!-- LOGIN -->
  <div id="loginView" class="login-wrap" hidden>
    <form class="login-card" id="loginForm">
      <div class="login-logo">🌱</div>
      <h1>Admin Dashboard</h1>
      <p>RISE WITH PLEDGE Foundation</p>
      <div class="field"><label>Email / Username</label><input name="username" required autocomplete="username" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Sign In</button>
      <div class="form-msg" id="loginMsg"></div>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" class="dash" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <span class="brand-mark">🌱</span>
        <div><b>Rise With Pledge</b><span>Admin Dashboard</span></div>
      </div>
      <nav class="side-nav" id="sideNav">
        <span class="side-label">Overview</span>
        <button data-view="overview" class="active">📊 Overview</button>
        <span class="side-label">Submissions</span>
        <button data-view="members">🤝 Members <em class="pill" data-pill="members"></em></button>
        <button data-view="volunteers">🙋 Volunteers <em class="pill" data-pill="volunteers"></em></button>
        <button data-view="pledges">🎁 Pledges <em class="pill" data-pill="pledges"></em></button>
        <button data-view="contacts">✉️ Messages <em class="pill" data-pill="contacts"></em></button>
        <button data-view="partners_enquiries">🏛 Partner Enquiries <em class="pill" data-pill="partners_enquiries"></em></button>
        <button data-view="newsletter">📰 Newsletter <em class="pill" data-pill="newsletter"></em></button>
        <span class="side-label">Email Campaigns</span>
        <button data-view="campaigns">📣 Campaigns</button>
        <span class="side-label">Content</span>
        <button data-view="team">👥 Team</button>
        <button data-view="projects">🏗 Projects</button>
        <button data-view="stories">⭐ Success Stories</button>
        <button data-view="news">📅 News &amp; Events</button>
        <button data-view="gallery">🖼 Gallery</button>
        <button data-view="reports">📄 Reports</button>
        <button data-view="partners">🏛 Partners</button>
        <span class="side-label">Configuration</span>
        <button data-view="impact">📈 Impact Stats</button>
        <button data-view="settings">⚙️ Settings</button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank">🌍 View Website</a>
        <button id="logoutBtn">🚪 Log out</button>
      </div>
    </aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="burger" id="sideBurger" aria-label="Menu">☰</button>
        <h2 id="viewTitle">Overview</h2>
        <div class="top-actions">
          <button class="theme-toggle" id="adminTheme" title="Toggle theme">🌓</button>
        </div>
      </header>
      <div class="view-wrap" id="viewWrap"></div>
    </main>
  </div>

  <!-- modal -->
  <div class="modal-back" id="modalBack" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modalTitle">Edit</h3><button class="modal-x" id="modalClose">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
