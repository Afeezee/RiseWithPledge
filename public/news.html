<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News &amp; Events — Rise With Pledge Foundation</title>
  <meta name="description" content="Stay informed about outreach programmes, community projects, trainings, workshops, and announcements from the Rise With Pledge Foundation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
</head>
<body data-page="news">

  <section class="page-hero">
    <div class="container page-hero-inner">
      <div class="breadcrumb">Home / News &amp; Events</div>
      <h1>News &amp; Events</h1>
      <p>Outreach programmes, community projects, trainings and workshops, foundation events and announcements.</p>
    </div>
  </section>

  <section class="block">
    <div class="container">
      <div class="grid grid-3" id="newsGrid"></div>
    </div>
  </section>

  <section class="block soft">
    <div class="container">
      <div class="cta-band reveal">
        <h2>Never miss an update</h2>
        <p>Subscribe to our newsletter for programme updates, impact stories, volunteer opportunities, and upcoming events.</p>
        <a href="#footerNewsForm" class="btn btn-gold" onclick="document.querySelector('.footer-news input').focus()">Subscribe Below ↓</a>
      </div>
    </div>
  </section>

  <script src="/js/main.js"></script>
</body>
</html>
