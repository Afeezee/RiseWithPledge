<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News &amp; Events — Rise With Pledge Foundation</title>
  <meta name="description" content="Stay informed about outreach programmes, community projects, trainings, workshops, and announcements from the Rise With Pledge Foundation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/icon-16.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0042ab">
</head>
<body data-page="news">

  <section class="page-hero">
    <div class="container page-hero-inner">
      <div class="breadcrumb">Home / News &amp; Events</div>
      <h1>News &amp; Events</h1>
      <p>Outreach programmes, community projects, trainings and workshops, foundation events and announcements.</p>
    </div>
  </section>

  <section class="block">
    <div class="container">
      <div class="grid grid-3" id="newsGrid"></div>
    </div>
  </section>

  <section class="block soft">
    <div class="container">
      <div class="cta-band reveal">
        <h2>Never miss an update</h2>
        <p>Subscribe to our newsletter for programme updates, impact stories, volunteer opportunities, and upcoming events.</p>
        <a href="#footerNewsForm" class="btn btn-gold" onclick="document.querySelector('.footer-news input').focus()">Subscribe Below ↓</a>
      </div>
    </div>
  </section>

  <script src="/js/main.js"></script>
</body>
</html>
